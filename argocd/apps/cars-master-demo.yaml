# cars-master in the environment demo, from charts/cars-master of main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cars-master-demo
  namespace: argocd
  # Deleting the application deletes its workload too.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rljson/cars-deployment.git
    targetRevision: main
    path: charts/cars-master
    helm:
      releaseName: cars-master
      # The last one wins.
      valueFiles:
        - values.yaml
        - demo-values.yaml
        - image-tag.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
