# The app of apps: syncs every application in argocd/apps of main.
# Applied once by hand: kubectl apply -n argocd -f argocd/apps/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rljson/cars-deployment.git
    targetRevision: main
    path: argocd/apps
    directory:
      exclude: root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
