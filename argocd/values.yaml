# Values of the ArgoCD installation in the namespace argocd.
# Chart argo/argo-cd, version pinned in install.sh.
#
# Lean on purpose: one small node, no ingress, UI through port-forward.

global:
  domain: localhost:8443

configs:
  cm:
    # Built-in admin off; every operator signs in with a personal account.
    admin.enabled: false
    accounts.ben: login
    exec.enabled: false
    statusbadge.enabled: false
  rbac:
    policy.default: ""
    policy.csv: |
      g, ben, role:admin
  secret:
    # Passwords are set by set-password.sh, never by Helm.
    createSecret: true

# Single sign-on with Entra comes later; no Dex until then.
dex:
  enabled: false

# Not needed for the app of apps.
applicationSet:
  replicas: 0
notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

repoServer:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 512Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
