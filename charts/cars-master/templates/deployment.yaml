{{- if not .Values.image.registry }}
{{- fail "image.registry is missing: set it in <environment>-values.yaml" }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag is missing: set it in image-tag.yaml" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        {{- include "workload.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag }}
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ['ALL']
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
