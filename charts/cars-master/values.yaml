# Defaults of cars-master, the same in every environment.
# Overridden by demo-values.yaml, then by image-tag.yaml.

image:
  # Registry of the environment, set in <environment>-values.yaml.
  registry: ""
  repository: cars-master
  # Set in image-tag.yaml.
  tag: ""

replicas: 1

port: 3000
servicePort: 3000
healthPath: /health

readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
