# Defaults of cars-ui, the same in every environment.
# Overridden by demo-values.yaml, then by image-tag.yaml.

image:
  # Registry of the environment, set in <environment>-values.yaml.
  registry: ""
  repository: cars-ui
  # Set in image-tag.yaml.
  tag: ""

replicas: 1

port: 8080
servicePort: 80
healthPath: /healthz

readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
